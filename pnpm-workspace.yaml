  - '@cloudflare/workerd-darwin-arm64@1.20261013.1'
  - '@cloudflare/workerd-linux-64@1.20261013.1'
  - '@cloudflare/workerd-linux-arm64@1.20261013.1'
  - '@cloudflare/workerd-windows-64@1.20261013.1'
