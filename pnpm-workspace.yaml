  - '@cloudflare/workers-types@5.20261024.1'
  - '@modelcontextprotocol/client@2.4.0'
  - '@modelcontextprotocol/core@2.4.0'
  - '@modelcontextprotocol/server@2.4.0'
overrides:
  # Patched build/dev transitive dependencies, reviewed 14 October 2026.
  'undici@>=7.0.0 <7.30.1': 7.30.1
  # Undici EventSource/SRI and fast-uri parsing advisories, reviewed 24 October 2026.
  'undici@>=8.0.0 <8.12.2': 8.12.2
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  sharp: 0.35.5
  workerd: 1.20261013.1
  '@cloudflare/vite-plugin': 1.62.0
