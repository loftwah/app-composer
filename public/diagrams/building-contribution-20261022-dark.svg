<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#ff9b55"/></marker></defs><rect width="1200" height="560" fill="#17181b" rx="12"/><g font-family="Inter, system-ui, -apple-system, sans-serif"><g><rect x="40" y="60" width="240" height="110" rx="10" fill="#23252a" stroke="#4a505a" stroke-width="1.2"/><text x="160" y="92" text-anchor="middle" fill="#f2f3f5" font-size="21" font-weight="650">Visitor</text><text x="160" y="126" text-anchor="middle" fill="#b3b8c2" font-size="15">opens the profile</text></g><g><rect x="320" y="60" width="240" height="110" rx="10" fill="#23252a" stroke="#ff9b55" stroke-width="2"/><text x="440" y="92" text-anchor="middle" fill="#f2f3f5" font-size="21" font-weight="650">Guestbook form</text><text x="440" y="126" text-anchor="middle" fill="#b3b8c2" font-size="15">only while open</text></g><g><rect x="600" y="60" width="240" height="110" rx="10" fill="#23252a" stroke="#4a505a" stroke-width="1.2"/><text x="720" y="92" text-anchor="middle" fill="#f2f3f5" font-size="21" font-weight="650">Pending</text><text x="720" y="126" text-anchor="middle" fill="#b3b8c2" font-size="15">private item + media</text></g><g><rect x="880" y="60" width="240" height="110" rx="10" fill="#23252a" stroke="#4a505a" stroke-width="1.2"/><text x="1000" y="92" text-anchor="middle" fill="#f2f3f5" font-size="21" font-weight="650">Owner review</text><text x="1000" y="126" text-anchor="middle" fill="#b3b8c2" font-size="15">approve · reject · hide</text></g><g><rect x="40" y="330" width="240" height="110" rx="10" fill="#23252a" stroke="#4a505a" stroke-width="1.2"/><text x="160" y="362" text-anchor="middle" fill="#f2f3f5" font-size="21" font-weight="650">Profile card</text><text x="160" y="396" text-anchor="middle" fill="#b3b8c2" font-size="15">links to the source</text></g><g><r