chor="start" fill="#b3b8c2" font-size="13" paint-order="stroke" stroke="#17181b" stroke-width="4" stroke-linejoin="round">hide / revoke</text><path d="M920 170 C920 250 720 280 720 330" fill="none" stroke="#ff9b55" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="790" y="250" text-anchor="start" fill="#b3b8c2" font-size="13" paint-order="stroke" stroke="#17181b" stroke-width="4" stroke-linejoin="round">approve</text><path d="M600 385 L560 385" fill="none" stroke="#ff9b55" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="580" y="470" text-anchor="middle" fill="#b3b8c2" font-size="13" paint-order="stroke" stroke="#17181b" stroke-width="4" stroke-linejoin="round">approved note</text><path d="M320 385 L280 385" fill="none" stroke="#ff9b55" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="300" y="470" text-anchor="middle" fill="#b3b8c2" font-size="13" paint-order="stroke" stroke="#17181b" stroke-width="4" stroke-linejoin="round">render</text><path d="M880 440 C600 525 300 525 160 440" fill="none" stroke="#ff9b55" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/><text x="520" y="535" text-anchor="middle" fill="#b3b8c2" font-size="13" paint-order="stroke" stroke="#17181b" stroke-width="4" stroke-linejoin="round">next request removes card + media</text></g></svg>