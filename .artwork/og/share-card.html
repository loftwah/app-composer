<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App Composer share cards</title>
<style>
  @font-face{font-family:Space;src:url('../../public/brand/space-latin-20261018.woff2') format('woff2');font-display:block;font-weight:300 700}
  *{box-sizing:border-box;margin:0}
  body{background:#3a3d42;font-family:Space,Arial,sans-serif}
  .card{width:1200px;height:630px;position:relative;background:#f4f0e8;overflow:hidden}
  /* Screenprint grain, matching the mini-app tile treatment. */
  .card::after{
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.16'/></svg>");
  }
  .art{position:absolute;left:74px;top:50%;transform:translateY(-56%)}
  .art img{display:block;width:420px;height:420px;border:3px solid #252923;border-radius:6px;background:#f4f0e8}
  .route{position:absolute;left:-74px;top:44%;width:64px;height:9px;background:var(--accent);border-radius:5px}
  .copy{position:absolute;left:556px;top:50%;transform:translateY(-50%);width:588px}
  .eyebrow{font-size:19px;letter-spacing:.16em;text-transform:uppercase;color:#5c616a;margin-bottom:16px}
  h1{font-family:Space,system-ui;font-size:92px;line-height:1.02;letter-spacing:-.035em;font-weight:600;color:#252923;max-width:9ch}
  h1 em{font-style:normal;color:var(--accent-ink)}
  .lede{font-size:27px;line-height:1.34;color:#454952;margin-top:22px;max-width:20ch}
  .family{position:absolute;left:74px;bottom:32px;display:flex;align-items:center;gap:13px;font-size:19px;color:#5c616a}
  .family svg{width:30px;height:30px;flex:none}
  .family strong{font-family:Space,system-ui;font-weight:600;color:#252923;font-size:21px}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="art"><span class="route"></span><img id="art" alt=""></div>
  <div class="copy">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <p class="lede" id="lede"></p>
  </div>
  <p class="family">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#f4f0e8"/><path d="M10 12h32v32H10z" fill="none" stroke="#252923" stroke-width="6"/><path d="M24 26h30v28H24z" fill="#f4f0e8" stroke="#d95022" stroke-width="6"/><path d="M24 26v18h18" stroke="#252923" stroke-width="6" fill="none"/></svg>
    <strong>App Composer</strong> · composer.loftwah.com
  </p>
</div>
<script>
  const apps = {
    linkarooie:   { title:'Link<em>arooie</em>',   lede:'A personal page of curated links and featured work.', accent:'#a5fd0e', ink:'#4f7a00', eyebrow:'Publishing' },
    herethere:    { title:'Here / there',          lede:'A shared photo guestbook you build together.',        accent:'#d95022', ink:'#b23c14', eyebrow:'Publishing' },
    linkcheck:    { title:'Link Check',            lede:'See how a page appears in search and sharing.',       accent:'#2f9fbd', ink:'#1d7288', eyebrow:'Development' },
    hello:        { title:'Hello World',           lede:'A first deployment that proves the setup works.',     accent:'#ff9b55', ink:'#c25c10', eyebrow:'Development' },
    carryforward: { title:'Carry / forward',       lede:'Portable assistant context you choose to share.',     accent:'#8b5cf6', ink:'#6d3fd4', eyebrow:'Identity &amp; memory' },
  };
  const id = new URLSearchParams(location.search).get('app');
  const app = apps[id];
  document.documentElement.style.setProperty('--accent', app.accent);
  document.documentElement.style.setProperty('--accent-ink', app.ink);
  document.getElementById('art').src = '/public/brand/apps/' + id + '-v3.webp';
  document.getElementById('eyebrow').innerHTML = app.eyebrow;
  document.getElementById('title').innerHTML = app.title;
  document.getElementById('lede').textContent = app.lede;
  document.title = 'share-' + id;
</script>
</body>
</html>
