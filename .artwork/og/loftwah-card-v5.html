<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loftwah Linkarooie share card</title>
<style>
  @font-face{font-family:Space;src:url('../../public/brand/space-latin-20261018.woff2') format('woff2');font-display:block;font-weight:300 700}
  *{box-sizing:border-box;margin:0}
  body{font-family:Space,Arial,sans-serif}
  .card{width:1200px;height:630px;position:relative;background:#f4f0e8;overflow:hidden}
  .banner{position:absolute;inset:0 0 auto 0;height:392px;overflow:hidden;border-bottom:3px solid #1d2330}
  .banner img{width:100%;height:100%;object-fit:cover;object-position:38% 50%}
  .avatar{position:absolute;left:70px;top:288px;width:216px;height:216px;border-radius:50%;border:6px solid #f4f0e8;box-shadow:0 0 0 3px #1d2330;overflow:hidden;background:#1d2330}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .copy{position:absolute;left:322px;top:430px;right:70px}
  .copy h1{font-family:Space,system-ui;font-size:64px;line-height:1;letter-spacing:-.03em;color:#1d2330;font-weight:600}
  .copy p{font-size:23px;color:#454952;margin-top:12px;max-width:40ch}
  .handle{position:absolute;left:70px;top:522px;font:600 21px/1 Space,system-ui;color:#b23c14}
  .mark{position:absolute;right:70px;top:36px;display:flex;align-items:center;gap:10px;background:rgba(244,240,232,.92);border:2px solid #1d2330;border-radius:999px;padding:8px 16px;font:600 17px/1 Space,system-ui;color:#1d2330}
  .mark img{width:32px;height:32px;border-radius:5px}
</style>
</head>
<body>
<div class="card">
  <div class="banner"><img src="BANNER" alt=""></div>
  <div class="avatar"><img src="PORTRAIT" alt=""></div>
  <p class="handle">@loftwah</p>
  <div class="copy">
    <h1>Loftwah</h1>
    <p>Dean Lofts · builder, DevOps engineer and music producer. I like building things and making them work.</p>
  </div>
  <p class="mark"><img src="MARK" alt="">Linkarooie</p>
</div>
</body>
</html>
