<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Space;src:url('../../public/brand/space-latin-20261018.woff2') format('woff2');font-display:block;font-weight:300 700}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#fc5b05;color:#fff;font-family:Space,system-ui,sans-serif}
.stage{position:relative;width:1200px;height:630px;padding:54px 64px 46px;display:flex;flex-direction:column;justify-content:space-between}
.kicker{display:flex;align-items:center;gap:14px;font-size:17px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.kicker i{display:block;width:46px;height:3px;background:#fff}
.copy{max-width:690px}
h1{font-size:74px;line-height:.98;letter-spacing:-.045em;font-weight:650;margin:0 0 26px;text-wrap:balance}
p{margin:0;font-size:23px;line-height:1.4;max-width:610px;color:#fff;font-weight:400}
.mark{position:absolute;right:58px;top:142px;width:330px;height:330px;opacity:1}
.mark img{width:100%;height:100%;display:block}
.foot{display:flex;justify-content:space-between;align-items:end;border-top:1px solid rgba(255,255,255,.55);padding-top:18px;font-size:18px;letter-spacing:.01em}
.foot span:last-child{font-weight:600}
.note{position:absolute;right:64px;bottom:96px;width:230px;font-size:15px;line-height:1.45;color:rgba(255,255,255,.92)}
</style>
</head>
<body>
<div class="stage">
  <div class="kicker"><i></i><span>App Composer · build story</span></div>
  <div class="copy"><h1>Building App&nbsp;Composer, and building with&nbsp;it.</h1><p>A real brief, a local Worker run, and one guestbook note that earns its place.</p></div>
  <div class="mark"><img src="mark.svg" alt=""></div>
  <div class="note">Two independent apps. One explicit source contract. No copied credentials.</div>
  <div class="foot"><span>22 October 2026 · Walkthrough</span><span>composer.loftwah.com</span></div>
</div>
</body>
</html>
