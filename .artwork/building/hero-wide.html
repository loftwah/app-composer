<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
@font-face{font-family:Space;src:url('../../public/brand/space-latin-20261018.woff2') format('woff2');font-display:block;font-weight:300 700}
*{box-sizing:border-box}html,body{margin:0;width:1600px;height:640px;overflow:hidden}body{background:#fc5b05;color:#fff;font-family:Space,system-ui,sans-serif}
.stage{position:relative;width:1600px;height:640px;padding:56px 72px 44px;display:flex;flex-direction:column;justify-content:space-between}
.kicker{display:flex;align-items:center;gap:14px;font-size:17px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}.kicker i{display:block;width:48px;height:3px;background:#fff}
.middle{display:grid;grid-template-columns:360px 1fr;gap:90px;align-items:center;margin-top:10px}
.mark img{width:330px;height:330px;display:block}
.steps{display:grid;gap:20px;max-width:820px}
.step{display:grid;grid-template-columns:64px 1fr;gap:22px;align-items:baseline;border-top:1px solid rgba(255,255,255,.55);padding-top:16px}
.step span{font-size:16px;font-weight:600;letter-spacing:.08em}.step strong{display:block;font-size:34px;line-height:1.08;letter-spacing:-.03em;font-weight:600}
.foot{display:flex;justify-content:space-between;align-items:end;border-top:1px solid rgba(255,255,255,.55);padding-top:16px;font-size:18px}.foot span:last-child{font-weight:600}
</style></head><body><div class="stage">
<div class="kicker"><i></i><span>App Composer · build story</span></div>
<div class="middle"><div class="mark"><img src="mark.svg" alt=""></div><div class="steps">
<div class="step"><span>01</span><strong>A real brief, with the limits written down.</strong></div>
<div class="step"><span>02</span><strong>Two independent Workers, running locally.</strong></div>
<div class="step"><span>03</span><strong>One guestbook note that earns its place.</strong></div>
</div></div>
<div class="foot"><span>22 October 2026 · Walkthrough</span><span>composer.loftwah.com</span></div>
</div></body></html>
